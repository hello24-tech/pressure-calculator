name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish PressureTestCalculator.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: PressureTestCalculator-win-x64
          path: out/PressureTestCalculator.exe
